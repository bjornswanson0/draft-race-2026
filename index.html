<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draft Day Race 2026</title>
  <style>
    :root {
      --bg: #090d14;
      --surface: #111720;
      --border: #222c3a;
      --text: #e8edf5;
      --muted: #6a7a8e;
      --accent: #f0b132;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── HEADER ─────────────────────────── */
    .header {
      background: linear-gradient(160deg, #12063a 0%, #090d14 65%);
      border-bottom: 3px solid var(--accent);
      padding: 2rem 1.5rem 1.75rem;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .header h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 80px rgba(240,177,50,0.18);
    }
    .header h1 em { color: var(--accent); font-style: normal; }

    .header-sub { margin-top: 0.5rem; color: var(--muted); font-size: 0.85rem; }

    /* ── COUNTDOWN ──────────────────────── */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .cd-unit {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      min-width: 65px;
      text-align: center;
    }

    .cd-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .cd-lbl {
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
    }

    /* ── FIELD WRAPPER ──────────────────── */
    .field-outer {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* ── FOOTBALL FIELD ─────────────────── */
    .field {
      position: relative;
      width: 100%;
      height: 560px;
      background: #2e8b3e;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 50px rgba(0,0,0,0.6), inset 0 0 0 3px rgba(255,255,255,0.12);
    }

    /* alternating turf bands */
    .field::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.04) 10%,
        transparent 10%, transparent 20%
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ── END ZONES ──────────────────────── */
    .ez {
      position: absolute;
      top: 0; bottom: 0;
      width: 12%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .ez-left  { left: 0;  background: #b52020; }
    .ez-right { right: 0; background: #1a3a8a; }

    .ez-text {
      font-size: clamp(0.6rem, 1.5vw, 1rem);
      font-weight: 900;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.35);
      writing-mode: vertical-rl;
    }

    .ez-left  .ez-text { transform: rotate(180deg); }

    /* ── PLAYING FIELD AREA ─────────────── */
    .pf {
      position: absolute;
      left: 12%; right: 12%;
      top: 0; bottom: 0;
      z-index: 2;
    }

    /* yard lines */
    .yl {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.55);
      pointer-events: none;
    }

    /* hash marks */
    .hash {
      position: absolute;
      width: 10px;
      height: 2px;
      background: rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* yard numbers */
    .yn {
      position: absolute;
      font-size: clamp(8px, 1.1vw, 12px);
      font-weight: 800;
      color: rgba(255,255,255,0.45);
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    /* ── CENTER LOGO ────────────────────── */
    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
    }

    /* ── LANES ──────────────────────────── */
    .lanes {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .lane {
      flex: 1;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .lane:last-child { border-bottom: none; }

    /* team name pinned to left end zone */
    .lane-lbl {
      position: absolute;
      left: 0;
      width: 12%;
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(6px, 0.9vw, 10px);
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      text-align: center;
      padding: 0 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 6;
    }

    /* ── RUNNER ─────────────────────────── */
    .runner {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: left 3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 10;
    }

    .runner svg {
      display: block;
      width: 28px;
      height: 44px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* name tag above runner on hover */
    .runner::after {
      content: attr(data-name);
      position: absolute;
      bottom: calc(100% + 3px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.88);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 20;
    }

    .runner:hover::after { opacity: 1; }

    /* ── FINAL BANNER ───────────────────── */
    .final-banner {
      text-align: center;
      padding: 0.85rem;
      background: rgba(240,177,50,0.08);
      border: 1px solid rgba(240,177,50,0.22);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0 1rem 0.5rem;
    }

    /* ── BELOW-FIELD LAYOUT ─────────────── */
    .below {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 680px) {
      .below { grid-template-columns: 1fr; }
      .field { height: 360px; }
      .runner svg { width: 18px; height: 28px; }
    }

    /* ── CARD ───────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-head {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    /* ── STANDINGS ──────────────────────── */
    .s-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.025);
      transition: background 0.12s;
    }
    .s-row:last-child { border-bottom: none; }
    .s-row:hover { background: rgba(255,255,255,0.02); }

    .s-rank {
      font-size: 1rem;
      font-weight: 900;
      min-width: 1.4rem;
      color: var(--muted);
    }
    .s-rank.r1 { color: #ffd700; }
    .s-rank.r2 { color: #c0c0c0; }
    .s-rank.r3 { color: #cd7f32; }

    .s-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .s-info { flex: 1; min-width: 0; }
    .s-name  { font-size: 0.83rem; font-weight: 600; }
    .s-owner { font-size: 0.68rem; color: var(--muted); }

    .s-pick {
      font-size: 0.68rem; font-weight: 700;
      background: rgba(240,177,50,0.1);
      color: var(--accent);
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .s-bar { width: 70px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
    .s-fill { height: 100%; border-radius: 2px; transition: width 2s ease; }

    @media (max-width: 480px) {
      .s-bar { display: none; }
      .s-owner { display: none; }
    }

    /* ── CHAT ───────────────────────────── */
    .chat-msgs {
      height: 250px;
      overflow-y: auto;
      padding: 0.75rem 1.25rem;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .chat-msgs::-webkit-scrollbar { width: 3px; }
    .chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 0.55rem; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; } }

    .msg-av {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 800; flex-shrink: 0; color: #fff;
    }

    .msg-name  { font-weight: 700; font-size: 0.78rem; }
    .msg-ts    { font-size: 0.62rem; color: var(--muted); margin-left: 0.3rem; }
    .msg-text  { font-size: 0.83rem; color: #c5d0dc; line-height: 1.45; margin-top: 0.1rem; word-break: break-word; }

    .chat-form {
      display: flex; gap: 0.5rem;
      padding: 0.8rem 1.25rem;
      border-top: 1px solid var(--border);
    }
    .chat-form input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; padding: 0.5rem 0.75rem;
      color: var(--text); font-size: 0.83rem; outline: none;
    }
    .chat-form input:focus { border-color: var(--accent); }
    #name-in { width: 105px; flex-shrink: 0; }
    #msg-in  { flex: 1; }

    .chat-form button {
      background: var(--accent); color: #000; border: none;
      border-radius: 7px; padding: 0.5rem 0.95rem;
      font-weight: 800; font-size: 0.83rem; cursor: pointer;
      flex-shrink: 0;
    }
    .chat-form button:hover { opacity: 0.85; }

    .setup-note {
      margin: 0.6rem 1.25rem;
      padding: 0.7rem 0.9rem;
      background: rgba(240,177,50,0.05);
      border: 1px solid rgba(240,177,50,0.15);
      border-radius: 7px;
      font-size: 0.75rem; color: #c0a040; line-height: 1.65;
    }
    .setup-note strong { color: var(--accent); }
  </style>
</head>
<body>

<!-- ═══ HEADER ════════════════════════════════ -->
<div class="header">
  <div class="eyebrow">Fantasy Football · 2026 Season</div>
  <h1>DRAFT DAY <em>RACE</em></h1>
  <p class="header-sub">First to the end zone picks first. Draft locks September 2 at 8 PM ET.</p>
  <div class="countdown" id="countdown"></div>
</div>

<!-- ═══ FIELD ═════════════════════════════════ -->
<div class="field-outer">
  <div id="final-slot"></div>
  <div class="field" id="field">
    <!-- end zones -->
    <div class="ez ez-left"><span class="ez-text">START</span></div>
    <div class="ez ez-right"><span class="ez-text">FINISH</span></div>
    <!-- playing field (injected by JS) -->
    <div class="pf" id="pf"></div>
    <!-- lanes + runners (injected by JS) -->
    <div class="lanes" id="lanes"></div>
  </div>
</div>

<!-- ═══ STANDINGS + CHAT ══════════════════════ -->
<div class="below">
  <div class="card">
    <div class="card-head">📋 Current Draft Order</div>
    <div id="standings"></div>
  </div>
  <div class="card">
    <div class="card-head">💬 League Chat</div>
    <div id="chat-setup"></div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-form">
      <input id="name-in" placeholder="Your name" maxlength="20"/>
      <input id="msg-in"  placeholder="Talk trash..." maxlength="200"/>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  FIREBASE CONFIG — paste your config here for live chat
//  Race and standings work without it.
// ═══════════════════════════════════════════════════════
const FB = {
  apiKey:            "",
  authDomain:        "",
  databaseURL:       "",
  projectId:         "",
  storageBucket:     "",
  messagingSenderId: "",
  appId:             ""
};

// ═══════════════════════════════════════════════════════
//  TEAMS
// ═══════════════════════════════════════════════════════
const TEAMS = [
  { name: "Howie Roseman Stan",     owner: "knewk",         color: "#d94f4f" },
  { name: "A Plane hit the Bower",  owner: "hungrygunter",  color: "#e07c30" },
  { name: "Amon-Ra St. Downs",      owner: "JaxStroh",      color: "#29b08a" },
  { name: "CeeDeez Veiny Lambchop", owner: "NotWeirdWild",  color: "#c9b340" },
  { name: "LoveTneck",              owner: "zanetaylor21",  color: "#4a8fd4" },
  { name: "Costco Guys",            owner: "Sorenlind",     color: "#8b5fc4" },
  { name: "Many Men",               owner: "noahness10",    color: "#33c47a" },
  { name: "Darty People",           owner: "PenIsland7",    color: "#e04080" },
  { name: "Capitol Stormers",       owner: "xavierkolb",    color: "#3090c0" },
  { name: "2 inches (combined)",    owner: "mcgannon12",    color: "#e8c040" },
];

// ═══════════════════════════════════════════════════════
//  RACE TIMING
// ═══════════════════════════════════════════════════════
const RACE_START = new Date('2026-08-24T16:00:00Z').getTime(); // Aug 24 noon ET
const DRAFT_END  = new Date('2026-09-03T00:00:00Z').getTime(); // Sept 2 8 PM ET
const TICK_MS    = 60 * 60 * 1000; // hourly ticks

// ═══════════════════════════════════════════════════════
//  SEEDED RNG (mulberry32)
//  Same seed = same sequence = everyone sees same race.
// ═══════════════════════════════════════════════════════
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function computePositions(atMs) {
  const ticks = Math.max(0, Math.floor(
    (Math.min(atMs, DRAFT_END) - RACE_START) / TICK_MS
  ));
  return TEAMS.map((team, i) => {
    const rand = rng(i * 999983 + 0xBEEFCAFE);
    let pos = 0;
    for (let t = 0; t < ticks; t++) pos += rand();
    return { ...team, pos };
  });
}

function rankTeams(teams) {
  return [...teams].sort((a, b) => b.pos - a.pos).map((t, i) => ({ ...t, rank: i + 1 }));
}

// ═══════════════════════════════════════════════════════
//  PIXEL ART RUNNER SVG
// ═══════════════════════════════════════════════════════
function runnerSVG(color) {
  const w = 'rgba(255,255,255,0.25)';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 16" shape-rendering="crispEdges">
    <!-- helmet dome -->
    <rect x="2" y="0" width="6" height="1" fill="${color}"/>
    <rect x="1" y="1" width="8" height="3" fill="${color}"/>
    <!-- helmet center stripe -->
    <rect x="4" y="0" width="2" height="4" fill="${w}"/>
    <!-- facemask -->
    <rect x="1" y="3" width="3" height="1" fill="#9ab"/>
    <!-- neck/chin -->
    <rect x="3" y="4" width="3" height="1" fill="#e8b080"/>
    <!-- jersey torso -->
    <rect x="1" y="5" width="8" height="5" fill="${color}"/>
    <!-- number stripe -->
    <rect x="3" y="6" width="4" height="3" fill="${w}"/>
    <!-- left arm (forward, holding ball) -->
    <rect x="0" y="5" width="1" height="3" fill="${color}"/>
    <!-- football -->
    <rect x="0" y="7" width="2" height="2" fill="#8B4513"/>
    <rect x="0" y="7" width="2" height="1" fill="rgba(255,255,255,0.35)"/>
    <!-- right arm (back-swing) -->
    <rect x="9" y="6" width="1" height="2" fill="${color}"/>
    <!-- pants -->
    <rect x="2" y="10" width="6" height="2" fill="#ececec"/>
    <!-- left leg (planted, forward) -->
    <rect x="2" y="12" width="3" height="4" fill="#1a1a2a"/>
    <!-- right leg (raised back) -->
    <rect x="5" y="11" width="3" height="3" fill="#1a1a2a"/>
    <!-- left cleat -->
    <rect x="1" y="15" width="4" height="1" fill="#000"/>
    <!-- right cleat -->
    <rect x="5" y="13" width="3" height="1" fill="#000"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════
//  BUILD THE FIELD (yard lines, hash marks, logo)
// ═══════════════════════════════════════════════════════
function buildField() {
  const pf = document.getElementById('pf');
  const yardLabels = [10, 20, 30, 40, 50, 40, 30, 20, 10];
  let html = '';

  yardLabels.forEach((label, i) => {
    const pct = ((i + 1) / 10) * 100; // 10%, 20%... 90%
    // yard line
    html += `<div class="yl" style="left:${pct}%"></div>`;
    // numbers top and bottom
    html += `<div class="yn" style="left:${pct}%;top:8px">${label}</div>`;
    html += `<div class="yn" style="left:${pct}%;bottom:8px;top:auto">${label}</div>`;
  });

  // hash marks (2 rows: 1/3 and 2/3 from top)
  for (let i = 0; i <= 20; i++) {
    const x = (i / 20) * 100;
    html += `<div class="hash" style="left:calc(${x}% - 5px);top:calc(33% - 1px)"></div>`;
    html += `<div class="hash" style="left:calc(${x}% - 5px);top:calc(67% - 1px)"></div>`;
  }

  // center logo
  html += `
    <div class="logo">
      <svg width="110" height="120" viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
        <!-- outer shield -->
        <path d="M55,4 L104,22 L104,60 Q104,96 55,114 Q6,96 6,60 L6,22 Z"
              fill="#09122a" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" opacity="0.92"/>
        <!-- inner shield fill -->
        <path d="M55,11 L97,27 L97,60 Q97,90 55,107 Q13,90 13,60 L13,27 Z"
              fill="#0f1f48"/>
        <!-- accent border -->
        <path d="M55,4 L104,22 L104,60 Q104,96 55,114 Q6,96 6,60 L6,22 Z"
              fill="none" stroke="#f0b132" stroke-width="2" opacity="0.5"/>
        <!-- flaming football -->
        <ellipse cx="55" cy="65" rx="16" ry="10" fill="#7a3b10"/>
        <ellipse cx="55" cy="65" rx="16" ry="10" fill="#8B4513"/>
        <line x1="39" y1="65" x2="71" y2="65" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <line x1="48" y1="55.5" x2="48" y2="74.5" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        <line x1="55" y1="55" x2="55" y2="75" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        <line x1="62" y1="55.5" x2="62" y2="74.5" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        <!-- flame -->
        <path d="M40,62 Q36,50 44,44 Q42,53 47,50 Q44,57 50,55 Q47,62 52,60" fill="#f0b132" opacity="0.75"/>
        <path d="M41,62 Q39,52 45,47 Q44,54 48,51 Q46,58 51,56" fill="#ff6b20" opacity="0.65"/>
        <!-- DRAFT DAY text -->
        <text x="55" y="38" text-anchor="middle" fill="white"
              font-weight="900" font-size="9.5" font-family="-apple-system,sans-serif" letter-spacing="1.5">DRAFT DAY</text>
        <!-- RACE text -->
        <text x="55" y="100" text-anchor="middle" fill="#f0b132"
              font-weight="900" font-size="15" font-family="-apple-system,sans-serif" letter-spacing="3">RACE</text>
      </svg>
    </div>`;

  pf.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  BUILD LANES
// ═══════════════════════════════════════════════════════
let lanesBuilt = false;

function buildLanes() {
  const el = document.getElementById('lanes');
  el.innerHTML = TEAMS.map((team, i) => `
    <div class="lane" id="lane-${i}">
      <div class="lane-lbl" style="color:rgba(255,255,255,0.9)">${team.name}</div>
      <div class="runner" id="runner-${i}" data-name="${team.name}" style="left:13%">
        ${runnerSVG(team.color)}
      </div>
    </div>
  `).join('');
  lanesBuilt = true;
}

// ═══════════════════════════════════════════════════════
//  RENDER TRACK
// ═══════════════════════════════════════════════════════
function renderTrack(ranked) {
  if (!lanesBuilt) { buildLanes(); }

  const maxPos = Math.max(...ranked.map(t => t.pos)) || 1;
  const minPos = Math.min(...ranked.map(t => t.pos)) || 0;
  const spread = maxPos - minPos || 1;

  ranked.forEach(team => {
    const i = TEAMS.findIndex(t => t.name === team.name);
    const el = document.getElementById(`runner-${i}`);
    if (!el) return;
    // playable range: 13% (just past left endzone) to 83% (just before right endzone)
    const pct = 13 + ((team.pos - minPos) / spread) * 68;
    el.style.left = `${pct.toFixed(2)}%`;
  });
}

// ═══════════════════════════════════════════════════════
//  RENDER STANDINGS
// ═══════════════════════════════════════════════════════
const ORDINALS = ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];
const RANK_CLS  = { 1: 'r1', 2: 'r2', 3: 'r3' };

function renderStandings(ranked) {
  const maxPos = Math.max(...ranked.map(t => t.pos)) || 1;
  document.getElementById('standings').innerHTML = ranked.map(t => `
    <div class="s-row">
      <div class="s-rank ${RANK_CLS[t.rank] || ''}">${t.rank}</div>
      <div class="s-dot" style="background:${t.color}"></div>
      <div class="s-info">
        <div class="s-name">${t.name}</div>
        <div class="s-owner">@${t.owner}</div>
      </div>
      <div class="s-bar"><div class="s-fill" style="background:${t.color};width:${(t.pos/maxPos*100).toFixed(1)}%"></div></div>
      <div class="s-pick">${ORDINALS[t.rank - 1]}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════
//  COUNTDOWN
// ═══════════════════════════════════════════════════════
function updateCountdown() {
  const rem = DRAFT_END - Date.now();
  const el  = document.getElementById('countdown');
  if (rem <= 0) {
    el.innerHTML = '<div style="color:var(--accent);font-weight:800;font-size:1.1rem;letter-spacing:.05em">RACE COMPLETE — DRAFT ORDER IS LOCKED</div>';
    return;
  }
  const d = Math.floor(rem / 86400000);
  const h = Math.floor((rem % 86400000) / 3600000);
  const m = Math.floor((rem % 3600000)  / 60000);
  const s = Math.floor((rem % 60000)    / 1000);
  el.innerHTML = `
    <div class="cd-unit"><div class="cd-num">${d}</div><div class="cd-lbl">Days</div></div>
    <div class="cd-unit"><div class="cd-num">${String(h).padStart(2,'0')}</div><div class="cd-lbl">Hrs</div></div>
    <div class="cd-unit"><div class="cd-num">${String(m).padStart(2,'0')}</div><div class="cd-lbl">Min</div></div>
    <div class="cd-unit"><div class="cd-num">${String(s).padStart(2,'0')}</div><div class="cd-lbl">Sec</div></div>`;
}

// ═══════════════════════════════════════════════════════
//  MAIN RENDER
// ═══════════════════════════════════════════════════════
function render() {
  const now    = Date.now();
  const isDone = now >= DRAFT_END;

  if (isDone && !document.querySelector('.final-banner')) {
    const slot = document.getElementById('final-slot');
    slot.innerHTML = '<div class="final-banner">🏆 Race is over — draft order locked below</div>';
  }

  const positions = computePositions(isDone ? DRAFT_END : now);
  const ranked    = rankTeams(positions);
  renderTrack(ranked);
  renderStandings(ranked);
}

// ── INIT ────────────────────────────────────────
buildField();
buildLanes(); // sets all runners at left:13%

updateCountdown();
setInterval(updateCountdown, 1000);

// brief delay so CSS transition fires on initial load (race-start animation)
setTimeout(render, 200);
setInterval(render, 60 * 1000);

// ═══════════════════════════════════════════════════════
//  CHAT
// ═══════════════════════════════════════════════════════
const AV_COLORS = ['#d94f4f','#e07c30','#29b08a','#c9b340','#4a8fd4','#8b5fc4','#33c47a','#e04080','#3090c0','#e8c040'];

function avatarColor(name) {
  let h = 0;
  for (const c of (name || '?')) h = ((h << 5) - h) + c.charCodeAt(0);
  return AV_COLORS[Math.abs(h) % AV_COLORS.length];
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function msgHTML(m) {
  const col  = avatarColor(m.name);
  const init = (m.name || '?')[0].toUpperCase();
  const time = m.ts ? new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
  return `<div class="msg">
    <div class="msg-av" style="background:${col}">${init}</div>
    <div>
      <span class="msg-name" style="color:${col}">${esc(m.name)}</span>
      <span class="msg-ts">${time}</span>
      <div class="msg-text">${esc(m.text)}</div>
    </div>
  </div>`;
}

function appendMsg(m) {
  const box = document.getElementById('chat-msgs');
  box.insertAdjacentHTML('beforeend', msgHTML(m));
  box.scrollTop = box.scrollHeight;
}

// persist name
const saved = localStorage.getItem('ddr-name') || '';
if (saved) document.getElementById('name-in').value = saved;
document.getElementById('name-in').addEventListener('blur', e =>
  localStorage.setItem('ddr-name', e.target.value.trim()));

const fbReady = FB.apiKey && FB.databaseURL;

if (!fbReady) {
  document.getElementById('chat-setup').innerHTML = `
    <div class="setup-note">
      <strong>Chat is local-only right now</strong> — messages only show on your device.
      To enable live chat for the league, paste your Firebase Realtime Database config
      into the <code>FB</code> object at the top of the script.
      (console.firebase.google.com → New project → Realtime Database → Project settings → Web app)
    </div>`;

  const doSend = () => {
    const n = document.getElementById('name-in').value.trim() || 'Anonymous';
    const t = document.getElementById('msg-in').value.trim();
    if (!t) return;
    localStorage.setItem('ddr-name', n);
    appendMsg({ name: n, text: t, ts: Date.now() });
    document.getElementById('msg-in').value = '';
  };

  document.getElementById('send-btn').addEventListener('click', doSend);
  document.getElementById('msg-in').addEventListener('keydown', e => { if (e.key === 'Enter') doSend(); });

} else {
  (async () => {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getDatabase, ref, push, query, limitToLast, onChildAdded }
      = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');

    const db  = getDatabase(initializeApp(FB));
    const ref_ = ref(db, 'draft-race-2026/chat');

    onChildAdded(query(ref_, limitToLast(50)), snap => appendMsg(snap.val()));

    const doSend = () => {
      const n = document.getElementById('name-in').value.trim() || 'Anonymous';
      const t = document.getElementById('msg-in').value.trim();
      if (!t) return;
      localStorage.setItem('ddr-name', n);
      push(ref_, { name: n, text: t, ts: Date.now() });
      document.getElementById('msg-in').value = '';
    };

    document.getElementById('send-btn').addEventListener('click', doSend);
    document.getElementById('msg-in').addEventListener('keydown', e => { if (e.key === 'Enter') doSend(); });
  })();
}
</script>
</body>
</html>
